name: 🚀 GitHub Uploader

on:

  workflow_dispatch:

    inputs:

      repository:
        description: "Nome do repositório de destino"
        required: true
        type: string

      source:
        description: "Arquivo ou pasta dentro de uploads/"
        required: true
        type: string

      create:
        description: "Criar o repositório se não existir?"
        required: true
        type: boolean
        default: false

      private:
        description: "Criar como privado?"
        required: true
        type: boolean
        default: false

      branch:
        description: "Branch de destino"
        required: true
        type: string
        default: "main"

      remote_dir:
        description: "Subpasta no repositório (opcional)"
        required: false
        type: string
        default: ""

      commit:
        description: "Mensagem do commit"
        required: true
        type: string
        default: "Upload automático"

jobs:

  upload:

    name: 📦 Upload para GitHub

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # =====================================================
      # DEPENDÊNCIAS
      # =====================================================

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # VERIFICAR ARQUIVO
      # =====================================================

      - name: 🔎 Verificar origem
        run: |

          echo "Origem selecionada:"
          echo "${{ inputs.source }}"

          if [ ! -e "${{ inputs.source }}" ]; then
            echo
            echo "❌ ERRO:"
            echo "A origem não existe:"
            echo "${{ inputs.source }}"
            echo
            echo "Conteúdo de uploads/:"
            find uploads -maxdepth 3 -print
            exit 1
          fi

          echo
          echo "✅ Origem encontrada."

      # =====================================================
      # GIT
      # =====================================================

      - name: 🔧 Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # =====================================================
      # TOKEN
      # =====================================================

      - name: 🔐 Verificar MY_GITHUB_TOKEN
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |

          if [ -z "$MY_GITHUB_TOKEN" ]; then

            echo "❌ ERRO: MY_GITHUB_TOKEN não encontrado."
            echo
            echo "Configure:"
            echo
            echo "Settings"
            echo "→ Secrets and variables"
            echo "→ Actions"
            echo "→ Repository secrets"
            echo "→ New repository secret"
            echo
            echo "Nome:"
            echo "MY_GITHUB_TOKEN"

            exit 1
          fi

          echo "✅ MY_GITHUB_TOKEN encontrado."

      # =====================================================
      # MOSTRAR CONFIGURAÇÃO
      # =====================================================

      - name: 📋 Mostrar configuração
        run: |

          echo
          echo "=============================================="
          echo "       CONFIGURAÇÃO DO UPLOAD"
          echo "=============================================="
          echo
          echo "Usuário:"
          echo "josieljefferson12"
          echo
          echo "Repositório:"
          echo "${{ inputs.repository }}"
          echo
          echo "Origem:"
          echo "${{ inputs.source }}"
          echo
          echo "Criar:"
          echo "${{ inputs.create }}"
          echo
          echo "Privado:"
          echo "${{ inputs.private }}"
          echo
          echo "Branch:"
          echo "${{ inputs.branch }}"
          echo
          echo "Subpasta:"
          echo "${{ inputs.remote_dir }}"
          echo
          echo "Commit:"
          echo "${{ inputs.commit }}"
          echo
          echo "=============================================="

      # =====================================================
      # EXECUTAR UPLOAD
      # =====================================================

      - name: 🚀 Executar GitHub Uploader
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |

          ARGS=""

          # -------------------------------------------------
          # CREATE
          # -------------------------------------------------

          if [ "${{ inputs.create }}" = "true" ]; then
            ARGS="$ARGS --create"
          fi

          # -------------------------------------------------
          # PRIVATE
          # -------------------------------------------------

          if [ "${{ inputs.private }}" = "true" ]; then
            ARGS="$ARGS --private"
          fi

          # -------------------------------------------------
          # BRANCH
          # -------------------------------------------------

          ARGS="$ARGS --branch \"${{ inputs.branch }}\""

          # -------------------------------------------------
          # REMOTE DIR
          # -------------------------------------------------

          if [ -n "${{ inputs.remote_dir }}" ]; then
            ARGS="$ARGS --remote-dir \"${{ inputs.remote_dir }}\""
          fi

          # -------------------------------------------------
          # COMMIT
          # -------------------------------------------------

          ARGS="$ARGS --commit \"${{ inputs.commit }}\""

          # -------------------------------------------------
          # EXECUTAR
          # -------------------------------------------------

          eval "python scripts/github_uploader.py \
            \"${{ inputs.source }}\" \
            --repo \"${{ inputs.repository }}\" \
            $ARGS"

      # =====================================================
      # FINAL
      # =====================================================

      - name: ✅ Resultado
        run: |

          echo
          echo "=============================================="
          echo "       UPLOAD FINALIZADO"
          echo "=============================================="
          echo
          echo "Repositório:"
          echo "https://github.com/josieljefferson12/${{ inputs.repository }}"
          echo
          echo "=============================================="